name: priority_planner
description: An offline, paper-inspired personal planner for Android.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

# Provisional maintained stable release ranges, not resolved in this environment.
# Commit pubspec.lock after a successful pub get; see docs/DEPENDENCIES.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  drift: ^2.28.2
  go_router: ^16.2.4
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.40
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
